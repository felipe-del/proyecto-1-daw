<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de motores</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<aside class="menu-lateral">
    <h2>Proyecto 1</h2>
    <a href="/menu">Inicio</a><a href="/carros/pagina">Carros TXT</a><a href="/motores/pagina">Motores TXT</a>
    <a href="/carro-motor/pagina">Carros y Motores PostgreSQL</a><a href="/configuracion/pagina">Configuraciones y Especificaciones PostgreSQL</a>
    <a href="/mongo/carros/pagina">Carros MongoDB</a><a href="/mongo/motores/pagina">Motores MongoDB</a><a href="/logout">Cerrar sesión</a>
</aside>
<main class="contenido-interno">

<div class="contenedor">

    <h1>Tipos de motores</h1>

    <h2>Datos del motor</h2>

    <label for="codigo">Código</label>
    <input type="text" id="codigo">

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre">

    <label for="tipo">Tipo</label>
    <input type="text" id="tipo">

    <label for="cilindrada">Cilindrada</label>
    <input type="number" id="cilindrada">

    <label for="potencia">Potencia</label>
    <input type="number" id="potencia">

    <button id="btnGuardar">Guardar</button>
    <button id="btnModificar">Modificar</button>
    <button id="btnEliminar">Eliminar</button>
    <button id="btnConsultar">Consultar</button>
    <button id="btnLimpiar">Limpiar</button>
    <button id="btnSalir">Salir</button>

    <div id="mensaje"></div>

    <h2>Motores registrados</h2>

    <table id="tablaMotores">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Cilindrada</th>
                <th>Potencia</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <a class="enlace" href="/carros/pagina">Ir a carros de carreras</a>

</div>

</main>

<script src="/js/motores.js"></script>

</body>
</html>
